<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Thunderbird Commands</title>
  <link rel="stylesheet" href="browser-shell.css">
</head>
<body>
  <header class="browser-header">
    <div class="toolbar" role="toolbar" aria-label="Page navigation">
      <div class="window-controls" role="group" aria-label="Window controls">
        <button type="button" data-action="window-close" id="window-close" aria-label="Close window" title="Close window">×</button>
        <button type="button" data-action="window-minimize" id="window-minimize" aria-label="Minimize window" title="Minimize window">−</button>
        <button type="button" data-action="window-maximize" id="window-maximize" aria-label="Maximize window" title="Maximize window">□</button>
      </div>
      <button type="button" data-action="back" id="back" aria-label="Back" title="Back">←</button>
      <button type="button" data-action="forward" id="forward" aria-label="Forward" title="Forward">→</button>
      <button type="button" data-action="reload" id="reload" aria-label="Reload" title="Reload">↻</button>
      <span class="address" id="address" aria-live="polite">Console</span>
      <button type="button" data-action="open-browser" id="open-browser">Open in Browser</button>
      <button type="button" data-action="close" id="close" aria-label="Close tab">Close tab</button>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Application tabs"></nav>
  </header>
  <script src="browser-shell.js"></script>
</body>
</html>
